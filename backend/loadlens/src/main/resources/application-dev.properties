server.port=8080

# Database connection settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/loadlens}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1976}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.issuer=${JWT_ISSUER:api.substring.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

app.cors.front-end-url=${FRONT_END_URL:http://localhost:5173}
app.auth.frontend.success-redirect=${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
app.auth.frontend.failure-redirect=${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
# Hibernate/JPA settings
# ddl -> change in java show change in db
spring.jpa.hibernate.ddl-auto=update
# BTS sql command will be shown
spring.jpa.show-sql=true
# format the sql queries
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-stacktrace=never

